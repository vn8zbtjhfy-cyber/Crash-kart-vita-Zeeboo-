# Installable diagnostics only. This user-requested VPK is NOT a released game.
# No Zeebo ROM, MOD, MIF, images, music, or data.vfs are packaged.
name: CNK3D Vita hardware test VPK
on:
  push:
    branches:
      - feature/zeebx-vita-hardware-test-125
      - feature/zeebx-hid-rebased-126
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/vita-hardware-test.yml'
      - 'scripts/vita_elf_preflight.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-vpk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - name: Checkout source-only port
        uses: actions/checkout@v4
      - name: Reject commercial binary assets and previous packages
        shell: bash
        run: |
          set -euo pipefail
          test -f src/vita_main.c
          test -f src/cnk_zeebx_arm.c
          if find . -type f \( -iname '*.vpk' -o -iname '*.self' -o -iname '*.mod' -o -iname '*.mif' -o -iname '*.sig' -o -iname 'data.vfs' \) | grep -q .; then
            echo "ERROR: proprietary game asset or prebuilt package found in sources."
            exit 1
          fi
      - name: Compile Vita native race runtime and optional Zeebx probe
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-vita-hardware -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" -DCMAKE_BUILD_TYPE=Release -DCNK_ENABLE_VITA_ELF_LINK_CHECK=ON -DCNK_ENABLE_VITA_DIAGNOSTIC_VPK=ON
          cmake --build build-vita-hardware --parallel 4
      - name: Verify packaging and source-only archive
        shell: bash
        run: |
          set -euo pipefail
          vpk=build-vita-hardware/CNK3D-HARDWARE-TEST.vpk
          test -s "$vpk"
          python3 - <<'PY'
          import zipfile
          path = "build-vita-hardware/CNK3D-HARDWARE-TEST.vpk"
          with zipfile.ZipFile(path) as z:
              names = set(z.namelist())
              assert "eboot.bin" in names, names
              assert "sce_sys/param.sfo" in names, names
              forbidden = (".mod", ".mif", ".vfs", ".sig", ".wav", ".png", ".mp3")
              assert not any(n.lower().endswith(forbidden) for n in names), names
              print("Verified installable package structure; NO commercial assets:", sorted(names))
          PY
          sha256sum "$vpk"
      - name: Publish temporary VPK for user's PS Vita hardware test
        uses: actions/upload-artifact@v4
        with:
          name: CNK3D-Vita-Hardware-Test-VPK
          path: build-vita-hardware/CNK3D-HARDWARE-TEST.vpk
          if-no-files-found: error
          retention-days: 7
