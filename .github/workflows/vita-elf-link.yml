# VitaSDK link diagnosis, not a VPK build or PS Vita hardware test.
# Upload only original project source and these scripts to the private repo.
# Do NOT commit licensed ROM assets, data.vfs, extracted music or textures.
name: VitaSDK diagnostic ELF
on:
  push:
    branches: [main, 'feature/zeebx-indexed-triangles-132']
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'scripts/vita_elf_preflight.sh'
      - '.github/workflows/vita-elf-link.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vita-elf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - name: Checkout source-only repository
        uses: actions/checkout@v4
      - name: Verify project sources have been uploaded
        run: |
          test -f CMakeLists.txt
          test -f src/vita_main.c
          test -f src/cnk_vita_native_app.c
          test ! -e data.vfs
          test ! -e assets/cnk2.mod
          test ! -e assets/cnk2.sig
      - name: Cross-compile and link diagnostic native ELF
        run: bash scripts/vita_elf_preflight.sh "$GITHUB_WORKSPACE/build-vita-elf"
      - name: Audit ARM ELF format and symbols
        shell: bash
        run: |
          set -euo pipefail
          elf="$GITHUB_WORKSPACE/build-vita-elf/cnk_vita_elf_link_check"
          test -s "$elf"
          "$VITASDK/bin/arm-vita-eabi-readelf" -h "$elf" | tee /tmp/cnk_elf_header.txt
          grep -Eq 'Class:.*ELF32' /tmp/cnk_elf_header.txt
          grep -Eq 'Machine:.*ARM' /tmp/cnk_elf_header.txt
          "$VITASDK/bin/arm-vita-eabi-readelf" -Ws "$elf" > /tmp/cnk_elf_symbols.txt
          grep -Eq '[[:space:]]main$' /tmp/cnk_elf_symbols.txt
          grep -Eq '[[:space:]]cnk_vita_native_run$' /tmp/cnk_elf_symbols.txt
          "$VITASDK/bin/arm-vita-eabi-size" "$elf"
          sha256sum "$elf"
          printf 'Verified ELF32 ARM binary; NOT a VPK.\n'
      - name: Archive non-installable ARM ELF diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: cnk-vita-elf-diagnostic
          path: build-vita-elf/cnk_vita_elf_link_check
          retention-days: 7
          if-no-files-found: error
