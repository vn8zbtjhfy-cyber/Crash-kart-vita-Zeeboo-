# VitaSDK link diagnosis, not a VPK build or PS Vita hardware test.
# Upload only original project source and these scripts to the private repo.
# Do NOT commit licensed ROM assets, data.vfs, extracted music or textures.
name: VitaSDK diagnostic ELF
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'scripts/vita_elf_preflight.sh'
      - '.github/workflows/vita-elf-link.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vita-elf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - name: Checkout source-only repository
        uses: actions/checkout@v4
      - name: Verify project sources have been uploaded
        run: |
          test -f CMakeLists.txt
          test -f src/vita_main.c
          test -f src/cnk_vita_native_app.c
          test ! -e data.vfs
          test ! -e assets/cnk2.mod
          test ! -e assets/cnk2.sig
      - name: Cross-compile and link diagnostic native ELF
        run: bash scripts/vita_elf_preflight.sh "$GITHUB_WORKSPACE/build-vita-elf"
