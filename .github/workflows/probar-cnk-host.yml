name: Crash Nitro Kart - probar Zeebx ARM en host
on:
  push:
    branches: [main]
    paths:
      - 'ports/zeebx-rust-vita/probe_host/**'
      - 'ports/zeebx-rust-vita/rust/zeebx_vita/src/**'
      - 'ports/zeebx-rust-vita/tools/patch_zeebx_*.py'
      - '.github/workflows/probar-cnk-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Preparar recursos originales privados
        shell: bash
        run: |
          set -euo pipefail
          cd ports/zeebx-rust-vita
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          manifest=json.loads(Path('assets/manifest.json').read_text())
          fragments=sorted(Path('assets-parts').glob('part-*.bin'))
          zpath=Path('assets-original.zip')
          if not zpath.exists():
              assert len(fragments)==34, f"Expected 34 parts, got {len(fragments)}"
              zpath.write_bytes(b''.join(x.read_bytes() for x in fragments))
          assert hashlib.sha256(zpath.read_bytes()).hexdigest()=='e47b2d5ba0940259792e5658502e6a8705fc09d7bfef13758025a6fab32852f8'
          with zipfile.ZipFile(zpath) as z:
              for item in manifest['files']:
                  content=z.read('assets/'+item['path'])
                  assert hashlib.sha256(content).hexdigest()==item['sha256']
                  dst=Path('assets')/item['path']
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  dst.write_bytes(content)
          print('12 verified game resources available for host probe')
          PY
      - name: Clonar motor Zeebx y aplicar adaptador de datos
        run: |
          set -euo pipefail
          cd ports/zeebx-rust-vita
          git clone --depth 1 --branch development https://github.com/ZeebxTeam/zeebx-emu.git zeebx-emu
          python3 tools/patch_zeebx_embedded_fs.py zeebx-emu
          # The Vita CreateInstance continuation must be exercised by the
          # real Linux ARM probe too, rather than merely compile on PS Vita.
          python3 tools/patch_zeebx_create_budget_vita.py zeebx-emu
          # Zeebx normally gates its interpreter to Vita/iOS/WASM/tests.
          # Expose that CPU implementation in this Linux-only probe, so we
          # measure the same ARM backend instead of desktop Dynarmic.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('zeebx-emu/src/cpu/mod.rs')
          t = p.read_text()
          anchor = '#[cfg(any(test, target_arch = "wasm32", target_os = "ios"))]'
          assert t.count(anchor) == 1, 'Zeebx CPU cfg changed'
          t = t.replace(anchor, '')
          p.write_text(t)
          print('Host ARM interpreter enabled for probe')
          PY
          # Host-only test accessor for the applet returned through
          # CreateInstance's out pointer. Never changes the Vita release.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('zeebx-emu/src/machine/shell.rs')
          s=p.read_text()
          needle='impl<C: CpuBackend> Machine<C> {'
          assert s.count(needle)==1
          s=s.replace(needle, needle+'\n    pub fn host_probe_created_applet(&self) -> Result<u32, CpuError> {\n        self.cpu.read_u32(self.module.out_module + 4)\n    }\n',1)
          p.write_text(s)
          print('Host-only applet pointer accessor installed')
          PY
      - name: Comparar arranque ARM y presupuesto CreateInstance
        env:
          CNK_ASSETS: ../assets
          RUSTFLAGS: --cfg cnk_host_probe
        run: |
          cd ports/zeebx-rust-vita/probe_host
          cargo run --release --quiet --bin cnk-zeebx-host-probe
      - name: Ejecutar puente Rust exacto del VPK en host y validar menú y carrera
        env:
          CNK_ASSETS: ../assets
          RUSTFLAGS: --cfg cnk_host_probe
        run: |
          cd ports/zeebx-rust-vita/probe_host
          cargo run --release --quiet --bin vita_ffi_parity
      - name: Comparar respuesta del kart a analógico y cruceta con controles neutrales
        env:
          CNK_ASSETS: ../assets
          RUSTFLAGS: --cfg cnk_host_probe
        shell: bash
        run: |
          set -euo pipefail
          cd ports/zeebx-rust-vita/probe_host
          mkdir -p input_comparison
          # Preserve original analog test screenshot before alternative replays.
          cp milestone_17_*.ppm input_comparison/analog_80s.ppm
          for scenario in neutral dpad; do
            rm -f milestone_17_*.ppm
            CNK_INPUT_SCENARIO="$scenario" cargo run --release --quiet --bin cnk-zeebx-host-probe > "input_comparison/$scenario.log"
            cp milestone_17_*.ppm "input_comparison/${scenario}_80s.ppm"
            grep 'CNK_GAMEPLAY_PROOF' "input_comparison/$scenario.log"
          done
          python3 - <<'PY'
          from pathlib import Path
          files={label: Path(f'input_comparison/{label}_80s.ppm').read_bytes() for label in ('analog','neutral','dpad')}
          def ppm_rgb(data):
              # Genuine P6 guest frame, exactly 640x480 RGB24.
              header=b'P6\n640 480\n255\n'
              assert data.startswith(header), 'Unexpected guest framebuffer format'
              return data[len(header):]
          images={k:ppm_rgb(v) for k,v in files.items()}
          def changed(a,b):
              return sum(a[i:i+3]!=b[i:i+3] for i in range(0,len(a),3))
          for mode in ('analog','dpad'):
              diff=changed(images[mode],images['neutral'])
              print(f'GUEST_STEERING_AB_TEST mode={mode} changed_pixels={diff} of=307200 clock=~80s')
              # Zero difference is a useful negative result, not a reason to
              # manufacture a gameplay pass. Investigate device input next.
          PY
      # The *real* Vita saves to ux0:data, but GitHub artifacts reject
      # colon characters in both directory and file names on upload.
      # Copy host-generated frames without changing the emulator's save path.
      - name: Preparar capturas Vita FFI con rutas compatibles con GitHub
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          src='ports/zeebx-rust-vita/probe_host/ux0:data'
          dst='ports/zeebx-rust-vita/probe_host/ffi_frames'
          mkdir -p "$dst"
          if [ -d "$src" ]; then
            for snapshot in "$src"/*.ppm; do
              [ -f "$snapshot" ] || continue
              cp "$snapshot" "$dst/$(basename "$snapshot")"
            done
          fi
          ls -lh "$dst" || true
      - name: Publicar captura real del framebuffer emulado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CNK_Host_Framebuffer
          path: |
            ports/zeebx-rust-vita/probe_host/*.ppm
            ports/zeebx-rust-vita/probe_host/ffi_frames/*.ppm
            ports/zeebx-rust-vita/probe_host/input_comparison/*.ppm
            ports/zeebx-rust-vita/probe_host/input_comparison/*.log
          if-no-files-found: warn
          retention-days: 7
