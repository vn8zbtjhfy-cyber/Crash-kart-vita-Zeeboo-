# Compilacion prealfa del puente Rust Zeebx. El port C anterior permanece intacto.
name: Crash Nitro Kart Rust/Vita (experimental)
# Manual only: no push or pull_request runs; keep all build/test steps.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build-vpk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    container:
      image: vitasdk/vitasdk:2026.08
    env:
      CARGO_TARGET_ARMV7_SONY_VITA_NEWLIBEABIHF_LINKER: arm-vita-eabi-gcc
      CC_armv7_sony_vita_newlibeabihf: arm-vita-eabi-gcc
      AR_armv7_sony_vita_newlibeabihf: arm-vita-eabi-ar
    steps:
      - name: Checkout repo privado
        uses: actions/checkout@v4
      - name: Reconstruir ZIP de recursos y subirlo al repo privado
        run: |
          set -euo pipefail
          cd ports/zeebx-rust-vita
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          path=Path("assets-original.zip")
          parts=sorted(Path("assets-parts").glob("part-*.bin"))
          if not path.exists():
              if len(parts)!=34:
                  raise SystemExit(f"ERROR: faltan fragmentos: {len(parts)}/34")
              with path.open("wb") as out:
                  for part in parts: out.write(part.read_bytes())
          original=path.read_bytes()
          expected_sha="e47b2d5ba0940259792e5658502e6a8705fc09d7bfef13758025a6fab32852f8"
          if hashlib.sha256(original).hexdigest()!=expected_sha:
              raise SystemExit("ERROR: el ZIP no coincide con el original")
          manifest=json.loads(Path("assets/manifest.json").read_text())
          with zipfile.ZipFile(path) as z:
              expected={"assets/"+x["path"] for x in manifest["files"]}
              if set(z.namelist())!=expected:
                  raise SystemExit("ERROR: rutas inesperadas en ZIP")
              if z.testzip() is not None:
                  raise SystemExit("ERROR: CRC ZIP invalido")
              for item in manifest["files"]:
                  b=z.read("assets/"+item["path"])
                  if len(b)!=item["size"] or hashlib.sha256(b).hexdigest()!=item["sha256"]:
                      raise SystemExit("ERROR: fallo SHA256 de "+item["path"])
          print("ZIP restaurado y verificado: 12 recursos originales")
          PY
          # Los recursos se reconstruyen exclusivamente en el workspace del job.
          # Nunca hacer git commit/push desde esta etapa.
          test -s assets-original.zip
      - name: Extraer los 12 recursos originales antes de compilar
        run: |
          set -euo pipefail
          cd ports/zeebx-rust-vita
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib, zipfile
          root=Path('assets')
          manifest=json.loads((root/'manifest.json').read_text())
          bundle=Path('assets-original.zip')
          if not bundle.is_file():
              raise SystemExit("ERROR: falta assets-original.zip")
          with zipfile.ZipFile(bundle) as z:
              expected={'assets/'+item['path'] for item in manifest['files']}
              if set(z.namelist())!=expected:
                  raise SystemExit("ERROR: ZIP distinto a los 12 recursos originales")
              for item in manifest['files']:
                  content=z.read('assets/'+item['path'])
                  if len(content)!=item['size'] or hashlib.sha256(content).hexdigest()!=item['sha256']:
                      raise SystemExit("ERROR: hash/size invalido: "+item['path'])
                  dest=root/item['path']
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(content)
          print("12 recursos originales extraidos y comprobados")
          PY
      - name: Preparar Rust nightly dentro del contenedor VitaSDK
        shell: bash
        run: |
          set -euo pipefail
          command -v arm-vita-eabi-gcc
          command -v cmake
          command -v python3
          if ! command -v curl >/dev/null; then
            if command -v apt-get >/dev/null; then
              apt-get update -y && apt-get install -y curl ca-certificates
            elif command -v apk >/dev/null; then
              apk add --no-cache curl ca-certificates
            fi
          fi
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          export PATH="$HOME/.cargo/bin:$VITASDK/bin:$PATH"
          rustup toolchain install nightly --profile minimal --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$VITASDK/bin" >> "$GITHUB_PATH"
      - name: Preparar Zeebx e integrar CPU y IFILE de memoria
        run: |
          set -euo pipefail
          cd ports/zeebx-rust-vita
          test -f rust/zeebx_vita/Cargo.toml
          test -f rust/zeebx_vita/src/lib.rs
          test -f tools/patch_zeebx_interpreter.py
          test -f tools/patch_zeebx_embedded_fs.py
          git clone --depth 1 --branch development https://github.com/ZeebxTeam/zeebx-emu.git zeebx-emu
          python3 tools/patch_zeebx_interpreter.py zeebx-emu
          python3 tools/patch_zeebx_embedded_fs.py zeebx-emu
          python3 tools/patch_zeebx_sqlite_vita.py zeebx-emu
          python3 tools/patch_zeebx_boot_trace_vita.py zeebx-emu
          python3 tools/patch_zeebx_memory_vita.py zeebx-emu
          python3 tools/patch_zeebx_create_budget_vita.py zeebx-emu
          grep -F 'sqlite = ["dep:rusqlite"]' zeebx-emu/Cargo.toml
          grep -F 'rusqlite = { version = "0.37", optional = true' zeebx-emu/Cargo.toml
      - name: Compilar puente Rust con Cargo ANTES de CMake
        run: |
          set -euo pipefail
          export PATH="$VITASDK/bin:$PATH"
          cd ports/zeebx-rust-vita
          export CARGO_TARGET_DIR="$PWD/rust/zeebx_vita/target"
          cargo +nightly tree --manifest-path rust/zeebx_vita/Cargo.toml --target armv7-sony-vita-newlibeabihf --edges normal,build > /tmp/zeebx_vita_deps.txt
          if grep -E '(^|[[:space:]])(rusqlite|libsqlite3-sys)[[:space:]]' /tmp/zeebx_vita_deps.txt; then
            echo "ERROR: Vita Cargo dependencies still contain SQLite" >&2
            exit 1
          fi
          cargo +nightly build -Z build-std=std,panic_abort --release --target armv7-sony-vita-newlibeabihf --manifest-path rust/zeebx_vita/Cargo.toml
          test -s "$CARGO_TARGET_DIR/armv7-sony-vita-newlibeabihf/release/libzeebx_vita.a"
      - name: Validar todos los datos comerciales embebidos
        run: |
          set -euo pipefail
          cd ports/zeebx-rust-vita
          python3 tests/validate_assets.py
          python3 tests/fufs_index_smoke.py
      - name: Recompilar biblioteca vitaGL sin splash original
        run: |
          set -euo pipefail
          export PATH="$VITASDK/bin:$PATH"
          cd ports/zeebx-rust-vita
          bash scripts/build_vitagl_sin_splash.sh
      - name: CMake VitaSDK y VPK experimental
        run: |
          set -euo pipefail
          export PATH="$VITASDK/bin:$PATH"
          cd ports/zeebx-rust-vita
          echo "VitaSDK root: $VITASDK"
          test -f "$VITASDK/share/vita.toolchain.cmake"
          if command -v ninja >/dev/null 2>&1; then
            generator=(-G Ninja)
          elif command -v make >/dev/null 2>&1; then
            generator=()
          else
            echo "ERROR: Missing Ninja and make" >&2
            exit 1
          fi
          rust_staticlib="$PWD/rust/zeebx_vita/target/armv7-sony-vita-newlibeabihf/release/libzeebx_vita.a"
          test -s "$rust_staticlib"
          cmake -S . -B build "${generator[@]}" -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" -DCMAKE_BUILD_TYPE=Release -DNITRO_EXPERIMENTAL_VPK=ON -DZEEBX_CORE_LIBRARY="$rust_staticlib"
          cmake --build build --parallel 2
          test -s build/Crash_Nitro_Kart_3D.vpk
      - name: Guardar ELF y mapa de símbolos para diagnosticar psp2dmp
        uses: actions/upload-artifact@v4
        with:
          name: CNK_Vita_ELF_Symbols_Debug
          path: |
            ports/zeebx-rust-vita/build/CrashNitroKartVita
            ports/zeebx-rust-vita/build/CrashNitroKartVita.map
          if-no-files-found: error
          retention-days: 7
      - name: Publicar solo si existe VPK real compilado
        uses: actions/upload-artifact@v4
        with:
          name: Crash_Nitro_Kart_3D_EXPERIMENTAL
          path: ports/zeebx-rust-vita/build/Crash_Nitro_Kart_3D.vpk
          if-no-files-found: error
          retention-days: 7
