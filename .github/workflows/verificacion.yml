name: Validación de código (sin ROM)

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - '.github/workflows/verificacion.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilacion-y-pruebas-portatiles:
    name: C / PC (sin data.vfs)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build zlib1g-dev libpng-dev python3

      - name: Comprobar que NO haya ROM ni VPK
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -iname 'data.vfs' -o -iname '*.vpk' -o -iname '*.self' -o -iname '*.velf' -o -iname '*.mod' -o -iname '*.sig' -o -iname '*.wav' \) | grep -q .; then
            echo 'ERROR: recursos originales o instalables detectados.'
            exit 1
          fi

      - name: Configurar CMake Release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compilar código y pruebas
        run: cmake --build build --parallel 2

      - name: Pruebas portátiles (no usan ROM)
        run: >-
          ctest --test-dir build --output-on-failure
          -R '^(ai_reacquire|race_hud_text|motion_steer|vita_motion|zeebx_ima|zeebx_cache_texture_manifest|source_ui|zeebx_brew|zeebx_arm|zeebx_probe|zeebx_bootstrap|zeebx_applet|zeebx_brew_factories|zeebx_clock|zeebx_screen|zeebx_idib|zeebx_hid_state|zeebx_signals|zeebx_egl_legacy|zeebx_gl_bridge|zeebx_gl_state|zeebx_gl_projection|zeebx_vitagl_projection|zeebx_gl_primitives|zeebx_textures|zeebx_vitagl_textures|projectile_threat|item_visibility|weapons|hazard_priority|projectile_priority|item_transaction|pickup_order|vita_controls|vita_diagnostics|vita_telemetry|vita_source_path|collision_grid_extents|source_zip_safety)$'

      - name: Informe de cobertura limitada
        if: always()
        shell: bash
        run: |
          {
            echo '### Resultado de la revisión automática'
            echo ''
            echo '- Compilación del código C portátil para Linux.'
            echo '- Se ejecutan treinta y nueve pruebas que NO necesitan data.vfs.'
            echo '- Las pruebas con ROM, VitaSDK y PS Vita física NO se ejecutan.'
            echo '- No se crea VPK.'
          } >> "$GITHUB_STEP_SUMMARY"
