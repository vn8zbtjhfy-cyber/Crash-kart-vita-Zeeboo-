[package]
name = "zeebx_vita"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-2.0-or-later"

[lib]
name = "zeebx_vita"
crate-type = ["staticlib"]

[features]
# El puente Vita nunca activa el SQL del frontend Zeebx.
default = []

[dependencies]
# El script de preparación hace optional la dependencia rusqlite de Zeebx.
# default-features=false evita cargar 'desktop' y 'sqlite' para Vita.
zeebx = { path = "../../zeebx-emu", default-features = false }

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
opt-level = "s"

[package.metadata.vita]
title_id = "CNKVITA01"
title_name = "Crash Nitro Kart 3D"
